[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "epochdeck"
version = "0.1.0a1"
description = "Standalone, W&B-compatible experiment tracking"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["experiment-tracking", "machine-learning", "mlops", "wandb"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28,<1",
  "platformdirs>=4.3,<5",
  "psutil>=7,<8",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
wandb = ["wandb>=0.29,<0.30"]

[project.scripts]
epochdeck = "epochdeck.cli:app"

[project.urls]
Documentation = "https://github.com/gmmyung/epochdeck#readme"
Issues = "https://github.com/gmmyung/epochdeck/issues"
Repository = "https://github.com/gmmyung/epochdeck"

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "types-psutil>=7,<8",
]
release = ["hatchling==1.32.0", "twine==7.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/epochdeck"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
