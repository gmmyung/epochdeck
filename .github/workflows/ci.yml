name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@e9bfc9148566ca239aef4f5cb968674de15c3c20 # v3.5.2

      - name: Install locked dependencies
        run: nix develop --command just bootstrap

      - name: Run repository checks
        run: nix develop --command just check

  python-minimum-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@e9bfc9148566ca239aef4f5cb968674de15c3c20 # v3.5.2

      - name: Test the minimum supported Python
        run: >-
          nix develop --command uv run --project python --python 3.11 --locked
          pytest

      - name: Test the supported W&B SDK contract
        run: >-
          nix develop --command uv run --project python --python 3.11 --locked
          --extra wandb pytest python/tests/test_wandb_sdk_contract.py

  rust-minimum-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@e9bfc9148566ca239aef4f5cb968674de15c3c20 # v3.5.2

      - name: Build the embedded dashboard
        run: |
          nix develop --command pnpm --dir web install --frozen-lockfile
          nix develop --command just dashboard-build

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Check the minimum supported Rust
        run: cargo +1.85.0 check --workspace --all-targets --all-features --locked

  native-rust-portability:
    name: Native Rust on ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}

      - name: Run native storage and server tests
        run: >-
          cargo +1.85.0 test --locked --target "${{ matrix.target }}"
          --package epochdeck-storage --package epochdeck-server

  native-python-portability:
    name: Native Python on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2022]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.7
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Test the locked Python SDK
        run: uv run --project python --python 3.11 --locked pytest
