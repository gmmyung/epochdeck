name: GitHub prerelease

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a commit reachable from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Read release version
        id: release-version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Verify protected signed tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          [[ "$REF_PROTECTED" == "true" ]] || {
            echo "Release tag is not covered by a repository tag ruleset" >&2
            exit 1
          }
          ./scripts/verify-release-tag.sh "$GITHUB_REF_NAME" "$(git rev-parse HEAD)"

      - name: Validate release readiness
        run: |
          arguments=(--require-prerelease --require-release-ready)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            arguments+=(--tag "$GITHUB_REF_NAME")
          fi
          python3 scripts/check-release-version.py "${arguments[@]}"

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@e9bfc9148566ca239aef4f5cb968674de15c3c20 # v3.5.2

      - name: Install locked dependencies
        run: nix develop --command just bootstrap

      - name: Run complete repository checks
        run: nix develop --command just check

      - name: Test the supported W&B SDK contract
        run: >-
          nix develop --command uv run --project python --python 3.11 --locked
          --extra wandb pytest python/tests/test_wandb_sdk_contract.py

      - name: Preserve the tested dashboard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 1

  server:
    name: Server ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: epochdeck-server
            python: python3
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: epochdeck-server
            python: python3
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: epochdeck-server
            python: python3
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: epochdeck-server
            python: python3
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            binary: epochdeck-server.exe
            python: python
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download tested dashboard
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dashboard-dist
          path: web/dist

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.target }}

      - name: Install the native musl linker and ELF inspection tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils musl-tools

      - name: Configure native target toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            x86_64-unknown-linux-musl)
              echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >>"$GITHUB_ENV"
              echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >>"$GITHUB_ENV"
              echo 'AR_x86_64_unknown_linux_musl=ar' >>"$GITHUB_ENV"
              echo 'RUSTFLAGS=-C link-self-contained=yes' >>"$GITHUB_ENV"
              ;;
            aarch64-unknown-linux-musl)
              echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >>"$GITHUB_ENV"
              echo 'CC_aarch64_unknown_linux_musl=musl-gcc' >>"$GITHUB_ENV"
              echo 'AR_aarch64_unknown_linux_musl=ar' >>"$GITHUB_ENV"
              echo 'RUSTFLAGS=-C link-self-contained=yes' >>"$GITHUB_ENV"
              ;;
            *-apple-darwin)
              echo 'MACOSX_DEPLOYMENT_TARGET=13.0' >>"$GITHUB_ENV"
              ;;
            x86_64-pc-windows-msvc)
              echo 'RUSTFLAGS=-C target-feature=+crt-static' >>"$GITHUB_ENV"
              ;;
          esac

      - name: Run native storage and server tests
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          cargo +1.85.0 test --locked --target "$TARGET"
          --package epochdeck-storage --package epochdeck-server

      - name: Build release server
        env:
          TARGET: ${{ matrix.target }}
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct)"
          cargo +1.85.0 build \
            --release \
            --locked \
            --target "$TARGET" \
            --package epochdeck-server \
            --features embedded-dashboard

      - name: Verify native binary architecture
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          "${{ matrix.python }}" scripts/inspect-release-binary.py \
            --binary "target/$TARGET/release/$BINARY" \
            --target "$TARGET"

      - name: Verify static Linux linkage
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          binary="target/$TARGET/release/$BINARY"
          if readelf --program-headers "$binary" |
            grep --quiet "Requesting program interpreter"; then
            echo "Release binary has a dynamic interpreter" >&2
            exit 1
          fi
          if readelf --dynamic "$binary" 2>/dev/null |
            grep --quiet "(NEEDED)"; then
            echo "Release binary has dynamic dependencies" >&2
            exit 1
          fi

      - name: Audit macOS dynamic linkage
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          binary="target/$TARGET/release/$BINARY"
          otool -L "$binary" | tee linked-libraries.txt
          library_count=0
          while IFS= read -r library; do
            library_count=$((library_count + 1))
            case "$library" in
              /usr/lib/* | /System/Library/Frameworks/*) ;;
              *)
                echo "Release binary links a non-system library: $library" >&2
                exit 1
                ;;
            esac
          done < <(tail -n +2 linked-libraries.txt | awk '{print $1}')
          [[ "$library_count" -gt 0 ]]
          minimum_versions=$(otool -l "$binary" | awk '$1 == "minos" {print $2}')
          [[ "$minimum_versions" == "13.0" ]] || {
            echo "Release binary has unexpected macOS minimum version: $minimum_versions" >&2
            exit 1
          }

      - name: Inspect Windows runtime imports
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          $binary = "target/$env:TARGET/release/$env:BINARY"
          $inspection = & llvm-readobj.exe --file-headers --coff-imports $binary
          if ($LASTEXITCODE -ne 0) {
            throw "llvm-readobj failed with exit code $LASTEXITCODE"
          }
          $inspection | Set-Content -Encoding utf8 windows-imports.txt
          $imports = @(
            $inspection |
              Select-String '^\s*Name:\s*(.+\.dll)\s*$' |
              ForEach-Object { $_.Matches[0].Groups[1].Value }
          )
          if ($imports.Count -eq 0) {
            throw "release binary has no inspectable Windows imports"
          }
          foreach ($library in $imports) {
            if ([IO.Path]::GetFileName($library) -ne $library) {
              throw "release binary imports a DLL by path: $library"
            }
            if ($library -match '^(?i:vcruntime.*|msvcp.*|ucrtbase|api-ms-win-crt-.*)\.dll$') {
              throw "release binary dynamically imports the MSVC runtime: $library"
            }
          }
          $imports | Sort-Object -Unique

      - name: Create and verify server archive
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct)"
          "${{ matrix.python }}" scripts/package-release-server.py \
            --target "$TARGET" \
            --version "$VERSION" \
            --binary "target/$TARGET/release/$BINARY" \
            --output-dir release-out

      - name: Extract and smoke-test the finished archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive=(release-out/*)
          [[ "${#archive[@]}" -eq 1 ]]
          "${{ matrix.python }}" scripts/smoke-release-server.py \
            --archive "${archive[0]}" \
            --target "$TARGET" \
            --version "$VERSION"

      - name: Upload server archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-server-${{ matrix.target }}
          path: release-out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  python:
    name: Python distributions
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.7
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install minimum supported Python
        run: uv python install 3.11

      - name: Install the locked release build environment
        run: >-
          uv sync --project python --python 3.11 --locked --only-group release
          --no-install-project

      - name: Build and validate wheel and source distribution
        run: |
          cmp LICENSE python/LICENSE
          mkdir -p release-out
          uv build --project python --python python/.venv/bin/python \
            --no-build-isolation --out-dir release-out
          uv run --project python --no-sync twine check release-out/*
          wheels=(release-out/*.whl)
          sdists=(release-out/*.tar.gz)
          [[ "${#wheels[@]}" -eq 1 ]]
          [[ "${#sdists[@]}" -eq 1 ]]
          python/.venv/bin/python - "${wheels[0]}" "${sdists[0]}" LICENSE <<'PY'
          import email
          import pathlib
          import sys
          import tarfile
          import zipfile

          wheel = pathlib.Path(sys.argv[1])
          sdist = pathlib.Path(sys.argv[2])
          expected_license = pathlib.Path(sys.argv[3]).read_bytes()

          with zipfile.ZipFile(wheel) as archive:
              license_names = [
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/licenses/LICENSE")
              ]
              metadata_names = [
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              assert len(license_names) == 1, license_names
              assert len(metadata_names) == 1, metadata_names
              assert archive.read(license_names[0]) == expected_license
              message = email.message_from_bytes(archive.read(metadata_names[0]))
              assert message["License-Expression"] == "Apache-2.0"
              assert message.get_all("License-File") == ["LICENSE"]

          with tarfile.open(sdist, "r:gz") as archive:
              license_members = [
                  member for member in archive.getmembers()
                  if member.isfile() and member.name.endswith("/LICENSE")
              ]
              assert len(license_members) == 1, [member.name for member in license_members]
              extracted = archive.extractfile(license_members[0])
              assert extracted is not None
              assert extracted.read() == expected_license
          PY

      - name: Smoke-test installed wheel
        run: |
          wheels=(release-out/*.whl)
          [[ "${#wheels[@]}" -eq 1 ]]
          uv venv --python 3.11 "$RUNNER_TEMP/epochdeck-wheel-smoke"
          uv pip install --python "$RUNNER_TEMP/epochdeck-wheel-smoke/bin/python" "${wheels[0]}"
          "$RUNNER_TEMP/epochdeck-wheel-smoke/bin/python" - \
            "$PWD/python/pyproject.toml" "$PWD/LICENSE" <<'PY'
          import importlib.metadata
          import pathlib
          import subprocess
          import sys
          import tomllib

          import epochdeck

          metadata = tomllib.loads(pathlib.Path(sys.argv[1]).read_text())
          distribution = metadata["project"]["name"]
          expected = metadata["project"]["version"]
          expected_license = pathlib.Path(sys.argv[2]).read_bytes()
          assert importlib.metadata.version(distribution) == expected
          distribution_metadata = importlib.metadata.metadata(distribution)
          assert distribution_metadata["License-Expression"] == metadata["project"]["license"]
          assert distribution_metadata.get_all("License-File") == ["LICENSE"]
          installed_files = importlib.metadata.files(distribution)
          assert installed_files is not None
          installed_licenses = [
              path for path in installed_files
              if str(path).endswith(".dist-info/licenses/LICENSE")
          ]
          assert len(installed_licenses) == 1, installed_licenses
          assert installed_licenses[0].locate().read_bytes() == expected_license
          assert epochdeck.__version__ == expected
          command = pathlib.Path(sys.executable).with_name("epochdeck")
          result = subprocess.run(
              [command, "--version"],
              check=True,
              capture_output=True,
              text=True,
          )
          assert result.stdout == f"epochdeck {expected}\n"
          PY
          "$RUNNER_TEMP/epochdeck-wheel-smoke/bin/epochdeck" --help

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-python
          path: |
            release-out/*.whl
            release-out/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  python-smoke:
    name: Python ${{ matrix.python }} on ${{ matrix.runner }}
    needs: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2022]
        python: ["3.11", "3.13"]
    steps:
      - name: Download the exact Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-python
          path: release-python

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.7
          enable-cache: false

      - name: Install and import the wheel
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          wheels=(release-python/*.whl)
          [[ "${#wheels[@]}" -eq 1 ]]
          uv run --isolated --no-project --python "$PYTHON_VERSION" \
            --with "${wheels[0]}" python - <<'PY'
          import tempfile
          import sqlite3
          from pathlib import Path

          import epochdeck
          import epochdeck.backup
          import epochdeck.cli
          from epochdeck._wandb_state import (
              WandbImportError,
              checkpoint_process_lock,
          )

          assert epochdeck.__version__

          with tempfile.TemporaryDirectory(prefix="epochdeck-wheel-") as temporary:
              root = Path(temporary)
              run = epochdeck.init(
                  project="native-wheel-smoke",
                  name="offline-run",
                  mode="offline",
                  dir=root,
              )
              run.log({"loss": 1.0}, step=0)
              run.finish(summary={"result": "complete"})
              assert any((root / ".epochdeck" / "spool").iterdir())

              storage = epochdeck.backup.StorageRoots(
                  data=root / "storage-data",
                  metrics=root / "storage-metrics",
                  blobs=root / "storage-blobs",
              )
              storage.data.mkdir()
              storage.metrics.mkdir()
              storage.blobs.mkdir()
              with sqlite3.connect(storage.catalog) as database:
                  database.execute("CREATE TABLE health (ok INTEGER)")
              manifest = epochdeck.backup.backup_storage(
                  storage,
                  root / "physical-backup",
              )
              assert manifest["format"] == "epochdeck-physical-backup"

              checkpoint = root / "checkpoint.json"
              with checkpoint_process_lock(checkpoint):
                  try:
                      with checkpoint_process_lock(checkpoint):
                          raise AssertionError("a second checkpoint lock was acquired")
                  except WandbImportError:
                      pass

              with checkpoint_process_lock(checkpoint):
                  pass
          PY

  assemble:
    name: Assemble release candidate
    needs: [verify, server, python, python-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-dist
          merge-multiple: true

      - name: Verify exact manifest and generate SHA256SUMS
        run: >-
          python3 scripts/release-candidate.py create
          --directory release-dist --version "$VERSION"

      - name: Upload complete release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: release-dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Create GitHub prerelease
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download complete release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: release-dist

      - name: Verify assembled release candidate
        run: >-
          python3 scripts/release-candidate.py check
          --directory release-dist --version "$VERSION"

      - name: Revalidate protected signed tag
        env:
          GH_TOKEN: ${{ github.token }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          [[ "$REF_PROTECTED" == "true" ]] || {
            echo "Release tag is not covered by a repository tag ruleset" >&2
            exit 1
          }
          ./scripts/verify-release-tag.sh "$GITHUB_REF_NAME" "$(git rev-parse HEAD)"

      - name: Publish reviewed prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          mapfile -t assets < <(find release-dist -maxdepth 1 -type f | LC_ALL=C sort)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag \
            --prerelease \
            --title "EpochDeck $VERSION" \
            --notes-file "$notes"
