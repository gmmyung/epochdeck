[workspace]
resolver = "2"
members = [
  "crates/runloom-catalog",
  "crates/runloom-protocol",
  "crates/runloom-server",
  "crates/runloom-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
arrow-array = "59.2"
arrow-schema = "59.2"
axum = "0.8"
futures-util = "=0.3.31"
fs2 = "0.4"
mime_guess = "2.0"
parquet = { version = "59.2", features = ["arrow", "zstd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
] }
thiserror = "2.0"
tokio = { version = "1.0", features = [
  "fs",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tower-http = { version = "0.6", features = [
  "compression-br",
  "compression-gzip",
  "request-id",
  "fs",
  "trace",
] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.0", features = ["serde", "v7"] }
zip = { version = "6.0.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
